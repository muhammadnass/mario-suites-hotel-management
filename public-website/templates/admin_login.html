{% extends "base.html" %}
{% block title %}Admin Login - Mario Suites Ltd{% endblock %}
{% block content %}

<section class="section">
  <div class="wrap">
    <form class="form-card" method="post" action="{{ url_for('admin_login') }}">
      <h2 style="text-align:center; margin-bottom:6px;">Admin Login</h2>
      <p style="text-align:center; color:var(--color-muted); margin:0 0 10px; font-size:13px;">Edit the website's content, rooms and prices.</p>
      <label>Username<input type="text" name="username" required autofocus></label>
      <label>Password<input type="password" name="password" required></label>
      <div class="form-actions" style="justify-content:stretch;">
        <button type="submit" class="btn btn-call" style="width:100%; justify-content:center;">Log in</button>
      </div>
    </form>
  </div>
</section>

{% endblock %}
