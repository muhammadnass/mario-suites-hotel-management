{% extends "base.html" %}
{% block title %}Reset Password - Mario Suites Ltd{% endblock %}
{% block content %}

<div class="page-head"><h1>Reset password &mdash; {{ user['username'] }}</h1></div>

<div class="form-card-wrap">
<form class="form-card" method="post" action="{{ url_for('reset_password', user_id=user['id']) }}">
  <label>New password<input type="password" name="new_password" required></label>
  <label>Confirm new password<input type="password" name="confirm_password" required></label>
  <div class="form-actions">
    <a href="{{ url_for('users_page') }}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary">Reset password</button>
  </div>
</form>
</div>

{% endblock %}
